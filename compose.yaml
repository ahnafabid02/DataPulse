name: datapulse
services:
  db:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datapulse}
      POSTGRES_USER: ${POSTGRES_USER:-datapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - central_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: .
    environment:
      DATAPULSE_DATABASE_URL: ${DATAPULSE_CONTAINER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-datapulse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-datapulse}}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    environment:
      DATAPULSE_DATABASE_URL: ${DATAPULSE_CONTAINER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-datapulse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-datapulse}}
      DATAPULSE_LOG_LEVEL: ${DATAPULSE_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  central_db:
